
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCAD!AN GO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:hover, a:hover, .nav-item:hover {
  color: #ff2638;
}

.hidden {
  display: none !important;
}

#auth {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 420px;
  padding: 30px;
  background: #111;
  border: 1px solid #333;
  border-radius: 15px;
}

.logo {
  text-align: center;
  font-size: 29px;
  font-weight: bold;
  margin-bottom: 25px;
}

.red {
  color: #ff2638;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

button {
  color: white;
  background: #050505;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 11px 15px;
}

.tabs button {
  flex: 1;
}

.tabs button.active {
  border-color: #ff2638;
  color: #ff2638;
}

label {
  display: block;
  margin: 15px 0;
}

label span {
  display: block;
  margin-bottom: 7px;
}

input, select {
  width: 100%;
  padding: 12px;
  color: white;
  background: #080808;
  border: 1px solid #383838;
  border-radius: 8px;
}

.primary {
  width: 100%;
  margin-top: 10px;
}

#authMessage {
  margin-top: 15px;
  color: #ff9ca5;
  overflow-wrap: anywhere;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 0 22px;
  border-bottom: 1px solid #292929;
  background: #0b0b0b;
}

header .logo {
  margin: 0;
  font-size: 22px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-right select {
  width: auto;
}

.avatar-button {
  font-size: 23px;
  border-radius: 50%;
}

.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100vh - 70px);
}

aside {
  padding: 15px 10px;
  border-right: 1px solid #292929;
  background: #0d0d0d;
}

.nav-item {
  display: block;
  width: 100%;
  text-align: left;
  margin: 4px 0;
  background: transparent;
  border-color: transparent;
}

main {
  padding: 30px;
  min-width: 0;
}

h1 {
  font-size: clamp(27px, 4vw, 40px);
}

.muted {
  color: #aaa;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 15px;
  margin-top: 25px;
}

.card {
  min-height: 125px;
  padding: 20px;
  text-align: left;
  background: #121212;
  border: 1px solid #303030;
  border-radius: 12px;
}

.card:hover {
  border-color: #ff2638;
}

.card h3 {
  margin: 10px 0 5px;
}

.card p {
  color: #aaa;
  margin-bottom: 0;
  font-size: 13px;
}

.avatar-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.avatar-options button {
  font-size: 25px;
}

.avatar-options button.selected {
  border-color: #ff2638;
}

@media (max-width: 700px) {
  header {
    padding: 0 12px;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  aside {
    display: flex;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid #292929;
  }

  .nav-item {
    width: auto;
    flex-shrink: 0;
  }

  main {
    padding: 20px 15px;
  }
}
</style>
</head>

<body>

<section id="auth">
  <div class="auth-card">
    <div class="logo">
      ARCAD<span class="red">!</span>AN <span class="muted">GO</span>
    </div>

    <h2 id="authTitle">Witaj w ARCAD!AN GO</h2>
    <p class="muted" id="authSubtitle">
      Zaloguj się lub utwórz konto.
    </p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">
        Logowanie
      </button>
      <button id="signupTab" type="button">
        Rejestracja
      </button>
    </div>

    <form id="authForm">
      <label>
        <span>E-mail</span>
        <input id="email" type="email" required
               autocomplete="email" placeholder="adres@email.com">
      </label>

      <label>
        <span>Hasło</span>
        <input id="password" type="password" required
               minlength="6" autocomplete="current-password"
               placeholder="Minimum 6 znaków">
      </label>

      <label id="nameField" class="hidden">
        <span>Nazwa wyświetlana</span>
        <input id="displayName" type="text" maxlength="40">
      </label>

      <button id="submitButton" class="primary" type="submit">
        Zaloguj się
      </button>
    </form>

    <p id="authMessage" role="status"></p>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <button id="homeLogo" class="logo"
            style="border:0;background:transparent">
      ARCAD<span class="red">!</span>AN GO
    </button>

    <div class="header-right">
      <select id="language">
        <option value="pl">🇵🇱 Polski</option>
        <option value="en">🇬🇧 English</option>
      </select>
      <button id="profileButton" class="avatar-button">🦊</button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <button class="nav-item" data-page="home">⌂ Strona główna</button>
      <button class="nav-item" data-page="divisions">▦ Wszystkie działy</button>
      <button class="nav-item" data-page="pulse">❗ PULSE</button>
      <button class="nav-item" data-page="saved">☆ Zapisane</button>
      <button class="nav-item" data-page="profile">◉ Mój profil</button>
      <button class="nav-item" data-page="settings">⚙ Ustawienia</button>
      <button class="nav-item" id="logoutButton">↪ Wyloguj się</button>
    </aside>

    <main id="content"></main>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* WSTAW SWOJE DANE Z SUPABASE */
const SUPABASE_URL = "https://foblyiojofcmcxvgitoh.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_2kRas_WKlTjwBtkMdO3zyQ_4w50Coo5";

/* Nie używaj klucza service_role ani secret key. */

const authView = document.getElementById("auth");
const appView = document.getElementById("app");
const message = document.getElementById("authMessage");

let supabaseClient = null;
let mode = "login";
let user = null;
let page = "home";
let divisionName = "";
let avatar = "🦊";
let language = "pl";

const divisions = [
  ["MOTION", "🎬", "Filmy, seriale i animacja"],
  ["INK", "🎯", "Wydawnictwo"],
  ["GALLERY", "🗝️", "Sklep"],
  ["SIGNAL", "📡", "Telewizja"],
  ["WAVE", "〰️", "Radio"],
  ["ARCAD!AN+", "🖱️", "Streaming"],
  ["FORGE", "🎮", "Gry"],
  ["JUNIOR", "🧸", "Treści dla dzieci"],
  ["VAULT", "🔐", "Kolekcje limitowane"],
  ["PEOPLE", "🧬", "Zespół"],
  ["ECHO", "💿", "Muzyka"],
  ["STAGE", "🎭", "Teatr i wydarzenia na żywo"],
  ["PULSE", "❗", "Magazyn popkulturowy"],
  ["GATHERING", "🎟️", "Konwenty i wydarzenia"],
  ["PLAY", "➕", "Filmy, recenzje i gameplaye"]
];

function ready() {
  return window.supabase &&
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("WKLEJ_TUTAJ") &&
    SUPABASE_KEY.length > 15 &&
    !SUPABASE_KEY.includes("WKLEJ_TUTAJ");
}

function showMessage(text) {
  message.textContent = text;
}

function switchMode(nextMode) {
  mode = nextMode;
  message.textContent = "";

  const signup = mode === "signup";

  document.getElementById("loginTab").classList.toggle(
    "active", !signup
  );
  document.getElementById("signupTab").classList.toggle(
    "active", signup
  );

  document.getElementById("nameField").classList.toggle(
    "hidden", !signup
  );
  document.getElementById("displayName").required = signup;

  document.getElementById("submitButton").textContent =
    signup ? "Utwórz konto" : "Zaloguj się";

  document.getElementById("password").autocomplete =
    signup ? "new-password" : "current-password";

  document.getElementById("authTitle").textContent =
    signup ? "Dołącz do ARCAD!AN GO" : "Witaj w ARCAD!AN GO";

  document.getElementById("authSubtitle").textContent =
    signup ? "Utwórz swoje konto." : "Zaloguj się, aby kontynuować.";
}

function showAuth() {
  authView.classList.remove("hidden");
  appView.classList.add("hidden");
}

function showApp() {
  if (!user) {
    showAuth();
    return;
  }

  authView.classList.add("hidden");
  appView.classList.remove("hidden");
  avatar = user.user_metadata?.avatar || avatar;
  document.getElementById("profileButton").textContent = avatar;
  renderPage(page);
}

function friendlyError(error) {
  const text = error?.message || String(error);

  if (text.toLowerCase().includes("invalid login credentials")) {
    return "Nieprawidłowy e-mail lub hasło.";
  }

  if (text.toLowerCase().includes("user already registered")) {
    return "To konto już istnieje. Spróbuj się zalogować.";
  }

  if (text.toLowerCase().includes("email not confirmed")) {
    return "Potwierdź adres e-mail, klikając link w wiadomości.";
  }

  if (text.toLowerCase().includes("failed to fetch")) {
    return "Brak połączenia z Supabase. Sprawdź Project URL.";
  }

  return "Błąd Supabase: " + text;
}

document.getElementById("loginTab").addEventListener(
  "click", () => switchMode("login")
);

document.getElementById("signupTab").addEventListener(
  "click", () => switchMode("signup")
);

document.getElementById("authForm").addEventListener(
  "submit", async function(event) {
    event.preventDefault();
    message.textContent = "";

    if (!ready() || !supabaseClient) {
      showMessage(
        "Najpierw uzupełnij SUPABASE_URL i SUPABASE_KEY w kodzie."
      );
      return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const displayName =
      document.getElementById("displayName").value.trim();
    const button = document.getElementById("submitButton");

    if (mode === "signup" && !displayName) {
      showMessage("Wpisz nazwę wyświetlaną.");
      return;
    }

    button.disabled = true;

    try {
      let result;

      if (mode === "signup") {
        result = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              display_name: displayName,
              avatar: avatar
            },
            emailRedirectTo:
              window.location.origin + window.location.pathname
          }
        });

        if (result.error) throw result.error;

        if (result.data.session) {
          user = result.data.user;
          showApp();
        } else {
          showMessage(
            "Konto utworzone. Jeśli wymagane jest potwierdzenie e-maila, sprawdź swoją skrzynkę."
          );
          switchMode("login");
        }
      } else {
        result = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (result.error) throw result.error;

        user = result.data.user;
        showApp();
      }
    } catch (error) {
      showMessage(friendlyError(error));
    } finally {
      button.disabled = false;
      button.textContent =
        mode === "signup" ? "Utwórz konto" : "Zaloguj się";
    }
  }
);

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function renderCards() {
  return divisions.map(([name, icon, description]) => `
    <button class="card" data-division="${escapeHTML(name)}">
      <div style="font-size:25px">${icon}</div>
      <h3>${escapeHTML(name)}</h3>
      <p>${escapeHTML(description)}</p>
    </button>
  `).join("");
}

function renderPage(nextPage) {
  page = nextPage;
  const content = document.getElementById("content");
  const name = user.user_metadata?.display_name ||
    user.email.split("@")[0];

  if (page === "home") {
    content.innerHTML = `
      <p class="red">ARCAD!AN UNIVERSE</p>
      <h1>Witaj, <span class="red">${escapeHTML(name)}</span></h1>
      <p class="muted">Twoje centrum ARCAD!AN GO.</p>
      <h2>Odkryj nasze działy</h2>
      <div class="cards">${renderCards()}</div>
    `;
  } else if (page === "divisions") {
    content.innerHTML = `
      <h1>Wszystkie działy</h1>
      <p class="muted">Wybierz przestrzeń, którą chcesz odwiedzić.</p>
      <div class="cards">${renderCards()}</div>
    `;
  } else if (page === "pulse") {
    content.innerHTML = `
      <h1>PULSE <span class="red">!</span></h1>
      <p class="muted">Magazyn popkulturowy ARCAD!AN.</p>
      <p>Treści tego działu pojawią się tutaj w przyszłości.</p>
    `;
  } else if (page === "saved") {
    content.innerHTML = `
      <h1>Zapisane</h1>
      <p class="muted">Tutaj znajdziesz zapisane treści.</p>
    `;
  } else if (page === "profile") {
    const currentAvatar = user.user_metadata?.avatar || avatar;

    content.innerHTML = `
      <h1>Mój profil</h1>
      <p class="muted">${escapeHTML(user.email)}</p>
      <label>
        <span>Nazwa wyświetlana</span>
        <input id="profileName" maxlength="40"
          value="${escapeHTML(user.user_metadata?.display_name || "")}">
      </label>
      <h3>Wybierz avatar</h3>
      <div class="avatar-options">
        ${["🦊","🐺","🐈‍⬛","🐉","🦋","🐸","🦉","🐼","🦁","🐙","🦝","🐈"]
          .map(a => `<button type="button" data-avatar="${a}"
            class="${a === currentAvatar ? "selected" : ""}">${a}</button>`)
          .join("")}
      </div>
      <button id="saveProfile" style="margin-top:20px">Zapisz profil</button>
      <p id="profileMessage" class="muted"></p>
    `;

    content.querySelectorAll("[data-avatar]").forEach(button => {
      button.addEventListener("click", () => {
        avatar = button.dataset.avatar;
        content.querySelectorAll("[data-avatar]").forEach(item => {
          item.classList.toggle("selected", item === button);
        });
      });
    });

    document.getElementById("saveProfile").addEventListener(
      "click", saveProfile
    );
  } else if (page === "settings") {
    content.innerHTML = `
      <h1>Ustawienia</h1>
      <p class="muted">Język interfejsu</p>
      <select id="settingsLanguage">
        <option value="pl">Polski</option>
        <option value="en">English</option>
      </select>
      <p class="muted" style="margin-top:20px">
        Konto: ${escapeHTML(user.email)}
      </p>
    `;

    document.getElementById("settingsLanguage").value = language;
    document.getElementById("settingsLanguage").addEventListener(
      "change", event => {
        language = event.target.value;
        renderPage("settings");
      }
    );
  } else if (page === "division") {
    const selected = divisions.find(item => item[0] === divisionName);

    content.innerHTML = `
      <button id="backToDivisions">← Wszystkie działy</button>
      <h1 style="margin-top:25px">${selected ? selected[1] : ""} ${escapeHTML(divisionName)}</h1>
      <p class="muted">${selected ? escapeHTML(selected[2]) : ""}</p>
      <p>Ta przestrzeń jest przygotowana. Jej zawartość dodamy później.</p>
    `;

    document.getElementById("backToDivisions").addEventListener(
      "click", () => renderPage("divisions")
    );
  }

  content.querySelectorAll("[data-division]").forEach(button => {
    button.addEventListener("click", () => {
      divisionName = button.dataset.division;
      renderPage("division");
    });
  });
}

async function saveProfile() {
  const name = document.getElementById("profileName").value.trim();
  const status = document.getElementById("profileMessage");

  if (!name) {
    status.textContent = "Wpisz nazwę wyświetlaną.";
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.updateUser({
      data: {
        ...user.user_metadata,
        display_name: name,
        avatar: avatar
      }
    });

    if (error) throw error;

    user = data.user;
    document.getElementById("profileButton").textContent = avatar;
    status.textContent = "Profil zapisany.";
  } catch (error) {
    status.textContent = friendlyError(error);
  }
}

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => renderPage(button.dataset.page));
});

document.getElementById("homeLogo").addEventListener(
  "click", () => renderPage("home")
);

document.getElementById("profileButton").addEventListener(
  "click", () => renderPage("profile")
);

document.getElementById("logoutButton").addEventListener(
  "click", async () => {
    if (!confirm("Czy na pewno chcesz się wylogować?")) return;

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert(friendlyError(error));
      return;
    }

    user = null;
    showAuth();
  }
);

document.getElementById("language").addEventListener(
  "change", event => {
    language = event.target.value;

    if (language === "en") {
      document.documentElement.lang = "en";
      document.querySelectorAll("[data-page]").forEach((button, index) => {
        const english = [
          "⌂ Home", "▦ All divisions", "❗ PULSE",
          "☆ Saved", "◉ My profile", "⚙ Settings", "↪ Log out"
        ];
        button.textContent = english[index] || button.textContent;
      });
    } else {
      document.documentElement.lang = "pl";
      const polish = [
        "⌂ Strona główna", "▦ Wszystkie działy", "❗ PULSE",
        "☆ Zapisane", "◉ Mój profil", "⚙ Ustawienia", "↪ Wyloguj się"
      ];
      document.querySelectorAll("[data-page], #logoutButton").forEach(
        (button, index) => {
          button.textContent = polish[index] || button.textContent;
        }
      );
    }

    renderPage(page);
  }
);

if (ready()) {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    user = session?.user || null;

    if (user) showApp();
    else showAuth();
  });

  supabaseClient.auth.getSession().then(({ data, error }) => {
    if (error) {
      showMessage(friendlyError(error));
      return;
    }

    user = data.session?.user || null;

    if (user) showApp();
    else showAuth();
  });
} else {
  showAuth();
}

switchMode("login");
</script>
</body>
</html>
